# Project-wide Gradle settings.

# Enable AndroidX (required when depending on androidx.* artifacts).
android.useAndroidX=true

# Enable Jetifier to automatically migrate/support old support-library transitive dependencies.
# Safe to keep enabled even if you currently have no legacy support dependencies.
android.enableJetifier=true

# Optional quality-of-life defaults (do not affect correctness, but help local builds).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
